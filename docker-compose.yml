services:
  # Локальный Postgres в Docker — включён профилем "local-db" (см. COMPOSE_PROFILES в
  # .env). Чтобы подключиться к внешней БД (не этой), очистите COMPOSE_PROFILES в .env —
  # этот сервис не будет запускаться, а backend/grafana пойдут на DB_HOST:DB_PORT.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goodwill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goodwill}
      POSTGRES_DB: ${POSTGRES_DB:-goodwill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goodwill}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goodwill}:${POSTGRES_PASSWORD:-goodwill}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-goodwill}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      - uploads:/app/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads:/uploads:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-goodwill}
      # Анонимный доступ уровня "Viewer" + разрешение на встраивание в iframe — нужны,
      # чтобы дашборд открывался прямо на /admin сайта без отдельного логина в Grafana.
      # Это делает сам дашборд (агрегированную статистику, без личных данных пользователей)
      # доступным всем, кто может достучаться до порта 3000 — см. README про закрытие
      # порта 3000 файрволом на VDS, если это нежелательно.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-goodwill}
      GRAFANA_DB_NAME: ${POSTGRES_DB:-goodwill}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      backend:
        condition: service_started

volumes:
  pgdata:
  uploads:
  grafana-data:
