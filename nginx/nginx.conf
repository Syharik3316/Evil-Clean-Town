# Кэширование статики. У файлов нет хешей в именах, поэтому HTML/CSS/JS обязаны
# проверяться на свежесть (no-cache = «отдай из кэша, но сначала спроси ETag»):
# иначе после деплоя браузер продолжит крутить старый style.css и новая вёрстка
# не появится. Картинки и шрифты меняются вместе с именем файла — их держим долго.
# Значение считаем один раз в map, чтобы add_header остался только на уровне server:
# add_header внутри location отменяет унаследованные заголовки безопасности.
map $uri $cache_control {
    default                                       "no-cache";
    ~*\.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$    "public, max-age=2592000";
}

server {
    listen 80;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ^~ — чтобы префикс выигрывал у возможных regex-локаций и снимки ДЗЗ
    # (/static/satellite/*.png) точно уходили на backend, а не искались в root.
    location ^~ /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location ^~ /uploads/ {
        alias /uploads/;
    }

    location / {
        # Чистые адреса без .html: /events отдаёт содержимое events.html "под капотом",
        # сам файл на диске не переименовывается.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
