<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GoodWill — нет соединения</title>
<style>
  :root {
    --bg: #0a303e;
    --card: #0e3c4c;
    --text: #f3f2f2;
    --muted: rgba(243, 242, 242, .68);
    --accent: #0088b0;
    --accent-hover: #1186ac;
    --divider: rgba(243, 242, 242, .16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 26px;
    display: block;
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 26px;
  }
  button {
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.2;
    padding: 12px 28px;
    border-radius: 4px;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:active { opacity: .85; }
  .status {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  .spin {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--divider);
    border-top-color: var(--text);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: -1px;
    animation: spin .7s linear infinite;
  }
  [hidden] { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="offline-icon.png" alt="" />
    <h1 id="title">Нет соединения с интернетом</h1>
    <p id="desc">Похоже, пропало подключение. Проверьте Wi-Fi или мобильный интернет и попробуйте ещё раз.</p>
    <button id="retry" type="button">Повторить попытку</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    (function () {
      var REMOTE_URL = "https://gw.syharik.ru/";

      var title = document.getElementById("title");
      var desc = document.getElementById("desc");
      var status = document.getElementById("status");
      var retryBtn = document.getElementById("retry");

      if (navigator.onLine === false) {
        title.textContent = "Нет соединения с интернетом";
        desc.textContent = "Похоже, пропало подключение. Проверьте Wi-Fi или мобильный интернет и попробуйте ещё раз.";
      } else {
        title.textContent = "Не получилось загрузить сайт";
        desc.textContent = "Сервер GoodWill временно недоступен или произошла ошибка. Попробуйте ещё раз через минуту.";
      }

      function reload() {
        status.innerHTML = '<span class="spin"></span>Подключаемся…';
        retryBtn.disabled = true;
        window.location.href = REMOTE_URL + "?_retry=" + Date.now();
      }

      retryBtn.addEventListener("click", reload);

      window.addEventListener("online", function () {
        status.textContent = "Соединение восстановлено, загружаем сайт…";
        setTimeout(reload, 400);
      });
    })();
  </script>
</body>
</html>
