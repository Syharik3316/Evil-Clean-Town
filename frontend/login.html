<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Чистый берег</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav"><div id="app-nav"></div></nav>
  <div class="container" style="max-width:420px">
    <h1>Вход</h1>
    <div class="card fade-in">
      <div id="alert"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Логин</label>
          <input type="text" id="username" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" required />
        </div>
        <button class="btn" type="submit" style="width:100%">Войти</button>
      </form>
      <p class="muted" style="margin-top:14px">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    renderNav("/login");
    renderFooter();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      alertEl.innerHTML = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const tokens = await api.post("/auth/login", { username, password });
        setTokens(tokens.access_token, tokens.refresh_token);
        window.location.href = "/profile";
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
