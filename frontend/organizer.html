<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои мероприятия — GoodWill</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="theme-color" content="#0a303e" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="topbar" id="app-nav"></nav>

  <main class="wrap wrap-wide">
    <div class="kicker">Кабинет организатора</div>
    <h1>Мои мероприятия</h1>
    <p class="lead">Создавайте мероприятия с точкой сбора на Яндекс.Карте, управляйте заявками волонтёров и начисляйте бонусные баллы.</p>

    <div class="cols cols-side-wide">
      <div id="create-event-root"></div>
      <div class="stack" id="organizer-root"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="reject-modal" hidden>
    <div class="modal">
      <h2>Причина отказа</h2>
      <form id="reject-form">
        <div class="field"><label for="reject-reason">Причина</label><textarea class="input" id="reject-reason" rows="3" required></textarea></div>
        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" id="reject-cancel">Отмена</button>
          <button class="btn btn-danger" type="submit">Отклонить заявку</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/yamaps.js"></script>
  <script src="/js/organizer.js"></script>
  <script>
    renderNav("/organizer");
    renderFooter();
    initOrganizerPage();
  </script>
</body>
</html>
