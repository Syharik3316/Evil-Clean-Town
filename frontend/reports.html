<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Репорты о мусоре — GoodWill</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav"><div id="app-nav"></div></nav>
  <div class="container">
    <div id="reports-root">Загрузка…</div>
  </div>

  <div class="modal-backdrop" id="reason-modal" hidden>
    <div class="modal">
      <h2>Причина отклонения</h2>
      <form id="reason-form">
        <div class="field"><label for="reason-text">Причина</label><textarea id="reason-text" rows="3" required></textarea></div>
        <div style="display:flex; gap:8px">
          <button class="btn danger" type="submit">Отклонить</button>
          <button class="btn secondary" type="button" id="reason-cancel">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/reports.js"></script>
  <script>
    renderNav("/reports");
    renderFooter();
    initReportsPage();
  </script>
</body>
</html>
