<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Профиль — GoodWill</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="theme-color" content="#0a303e" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="topbar" id="app-nav"></nav>

  <main class="wrap">
    <div id="profile-root">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton"></div>
      <div class="skeleton skeleton-line-short"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="manual-verify-modal" hidden>
    <div class="modal">
      <h2>Ручная верификация</h2>
      <p class="muted" style="font-size:13px">Паспортные данные нужны только для подтверждения возраста и оформления волонтёрской книжки.</p>
      <div id="manual-verify-alert"></div>
      <form id="manual-verify-form">
        <div class="field"><label for="mv-full-name">ФИО</label><input class="input" type="text" id="mv-full-name" required /></div>
        <div class="field"><label for="mv-birth-date">Дата рождения</label><input class="input" type="date" id="mv-birth-date" required /></div>
        <div class="cols" style="grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label for="mv-passport-series">Серия паспорта</label><input class="input" type="text" id="mv-passport-series" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" required /></div>
          <div class="field"><label for="mv-passport-number">Номер паспорта</label><input class="input" type="text" id="mv-passport-number" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required /></div>
        </div>
        <div class="field"><label for="mv-issued-by">Кем выдан</label><input class="input" type="text" id="mv-issued-by" required /></div>
        <div class="field"><label for="mv-issued-date">Дата выдачи</label><input class="input" type="date" id="mv-issued-date" required /></div>
        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" id="manual-verify-cancel">Отмена</button>
          <button class="btn btn-primary" type="submit">Отправить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    renderNav("/profile");
    renderFooter();
    initProfilePage();

    const today = new Date().toISOString().slice(0, 10);
    document.getElementById("mv-birth-date").max = today;
    document.getElementById("mv-issued-date").max = today;
  </script>
</body>
</html>
