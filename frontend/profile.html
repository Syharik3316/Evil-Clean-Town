<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Профиль — GoodWill</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav"><div id="app-nav"></div></nav>
  <div class="container">
    <div id="profile-root">Загрузка…</div>

    <div id="leaderboard-section">
      <h2>Лидерборд</h2>
      <div class="card">
        <div style="display:flex; gap:8px; margin-bottom:10px">
          <button class="btn secondary" data-scope="users">Пользователи</button>
          <button class="btn secondary" data-scope="teams">Команды/школы</button>
        </div>
        <div id="leaderboard-table">Загрузка…</div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="manual-verify-modal" hidden>
    <div class="modal">
      <h2>Ручная верификация</h2>
      <p class="muted">Введите паспортные данные для подтверждения возраста.</p>
      <div id="manual-verify-alert"></div>
      <form id="manual-verify-form">
        <div class="field"><label for="mv-full-name">ФИО</label><input type="text" id="mv-full-name" required /></div>
        <div class="field"><label for="mv-birth-date">Дата рождения</label><input type="date" id="mv-birth-date" required /></div>
        <div class="field"><label for="mv-passport-series">Серия паспорта</label><input type="text" id="mv-passport-series" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" required /></div>
        <div class="field"><label for="mv-passport-number">Номер паспорта</label><input type="text" id="mv-passport-number" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required /></div>
        <div class="field"><label for="mv-issued-by">Кем выдан</label><input type="text" id="mv-issued-by" required /></div>
        <div class="field"><label for="mv-issued-date">Дата выдачи</label><input type="date" id="mv-issued-date" required /></div>
        <div style="display:flex; gap:8px">
          <button class="btn" type="submit">Отправить</button>
          <button class="btn secondary" type="button" id="manual-verify-cancel">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    renderNav("/profile");
    renderFooter();
    initProfilePage();

    const today = new Date().toISOString().slice(0, 10);
    document.getElementById("mv-birth-date").max = today;
    document.getElementById("mv-issued-date").max = today;
  </script>
</body>
</html>
