<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — Чистый берег</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav"><div id="app-nav"></div></nav>
  <div class="container" style="max-width:420px">
    <h1>Регистрация</h1>
    <div class="card">
      <div id="alert"></div>
      <form id="register-form">
        <div class="field">
          <label for="display_name">Имя</label>
          <input type="text" id="display_name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" minlength="6" required />
        </div>
        <button class="btn" type="submit" style="width:100%">Создать аккаунт</button>
      </form>
      <p class="muted" style="margin-top:14px">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("register.html");

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      alertEl.innerHTML = "";
      const display_name = document.getElementById("display_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const tokens = await api.post("/auth/register", { display_name, email, password });
        setTokens(tokens.access_token, tokens.refresh_token);
        window.location.href = "profile.html";
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
