<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — Чистый берег</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav"><div id="app-nav"></div></nav>
  <div class="container" style="max-width:420px">
    <h1>Регистрация</h1>
    <div class="card fade-in">
      <div id="alert"></div>
      <form id="register-form">
        <div class="field">
          <label for="display_name">Имя</label>
          <input type="text" id="display_name" required />
        </div>
        <div class="field">
          <label for="username">Логин</label>
          <input type="text" id="username" minlength="3" required />
        </div>
        <div class="field">
          <label for="email">Активная почта</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" minlength="6" required />
        </div>

        <div id="organizer-fields" hidden>
          <div class="field">
            <label for="org_name">Название организации</label>
            <input type="text" id="org_name" />
          </div>
          <div class="field">
            <label for="inn">ИНН</label>
            <input type="text" id="inn" inputmode="numeric" pattern="[0-9]{10,12}" />
          </div>
        </div>

        <button class="btn" type="submit" style="width:100%">Создать аккаунт</button>
      </form>
      <button class="btn secondary" id="organizer-toggle" style="width:100%; margin-top:10px">Я организатор</button>
      <p class="muted" style="margin-top:14px">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>

  <div class="modal-backdrop" id="code-modal" hidden>
    <div class="modal">
      <h2>Подтверждение почты</h2>
      <p class="muted">Мы отправили код подтверждения на <strong id="code-modal-email"></strong>.</p>
      <div id="code-alert"></div>
      <form id="code-form">
        <div class="field">
          <label for="code">Код из письма</label>
          <input type="text" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus />
        </div>
        <button class="btn" type="submit" style="width:100%">Подтвердить</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("register.html");

    let isOrganizer = false;
    let pendingEmail = "";

    document.getElementById("organizer-toggle").addEventListener("click", () => {
      isOrganizer = !isOrganizer;
      document.getElementById("organizer-fields").hidden = !isOrganizer;
      document.getElementById("org_name").required = isOrganizer;
      document.getElementById("inn").required = isOrganizer;
      document.getElementById("organizer-toggle").textContent = isOrganizer
        ? "Я волонтёр"
        : "Я организатор";
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      alertEl.innerHTML = "";
      const display_name = document.getElementById("display_name").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const payload = { display_name, username, email, password };
      const path = isOrganizer ? "/auth/register/organizer" : "/auth/register";
      if (isOrganizer) {
        payload.org_name = document.getElementById("org_name").value.trim();
        payload.inn = document.getElementById("inn").value.trim();
      }

      try {
        const res = await api.post(path, payload);
        pendingEmail = res.email;
        document.getElementById("code-modal-email").textContent = pendingEmail;
        document.getElementById("code-modal").hidden = false;
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    });

    document.getElementById("code-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("code-alert");
      alertEl.innerHTML = "";
      const code = document.getElementById("code").value.trim();
      try {
        const tokens = await api.post("/auth/verify-email", { email: pendingEmail, code });
        setTokens(tokens.access_token, tokens.refresh_token);
        window.location.href = "profile.html";
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
